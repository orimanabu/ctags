<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ctags WASM Demo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, sans-serif;
      background: #f5f5f5;
      color: #333;
      padding: 2rem;
      max-width: 1100px;
      margin: 0 auto;
    }

    h1 {
      font-size: 1.4rem;
      margin-bottom: 0.3rem;
      color: #222;
    }

    .subtitle {
      font-size: 0.82rem;
      color: #888;
      margin-bottom: 1.5rem;
    }

    .subtitle code {
      background: #e8e8e8;
      padding: 0.05rem 0.3rem;
      border-radius: 3px;
      font-family: "SFMono-Regular", Consolas, monospace;
    }

    .card {
      background: white;
      border-radius: 8px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }

    label {
      display: block;
      font-size: 0.82rem;
      font-weight: 600;
      color: #555;
      margin-bottom: 0.35rem;
    }

    .controls {
      display: flex;
      gap: 0.75rem;
      align-items: flex-end;
      margin-bottom: 0.75rem;
    }

    .filename-group { flex: 1; }

    .format-group { flex: 0 0 auto; }

    select {
      padding: 0.42rem 0.65rem;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 0.88rem;
      background: white;
      cursor: pointer;
    }

    select:focus {
      outline: none;
      border-color: #4a90e2;
      box-shadow: 0 0 0 2px rgba(74,144,226,0.2);
    }

    input[type="text"] {
      width: 100%;
      padding: 0.42rem 0.65rem;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 0.9rem;
      font-family: monospace;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: #4a90e2;
      box-shadow: 0 0 0 2px rgba(74,144,226,0.2);
    }

    textarea {
      width: 100%;
      height: 230px;
      padding: 0.75rem;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 0.88rem;
      font-family: "SFMono-Regular", Consolas, monospace;
      resize: vertical;
      line-height: 1.55;
    }

    textarea:focus {
      outline: none;
      border-color: #4a90e2;
      box-shadow: 0 0 0 2px rgba(74,144,226,0.2);
    }

    button#submit {
      padding: 0.42rem 1.4rem;
      background: #4a90e2;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    button#submit:hover { background: #357abd; }
    button#submit:disabled { background: #aac4e8; cursor: not-allowed; }

    .hint {
      font-size: 0.75rem;
      color: #aaa;
      margin-top: 0.4rem;
    }

    .status {
      font-size: 0.8rem;
      color: #888;
      margin-top: 0.5rem;
      min-height: 1.2em;
    }

    .status.loading { color: #e08a00; }
    .status.ready   { color: #2e9c4e; }
    .status.error   { color: #c0392b; }

    #output-section { display: none; }

    .output-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }

    .output-header h2 { font-size: 1rem; color: #444; }

    .tag-count { font-size: 0.8rem; color: #888; }

    /* JSON table */
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.82rem;
      font-family: "SFMono-Regular", Consolas, monospace;
    }

    thead th {
      text-align: left;
      padding: 0.4rem 0.65rem;
      background: #f0f4f8;
      border-bottom: 2px solid #dce4ec;
      color: #555;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    tbody tr:nth-child(even) { background: #fafafa; }
    tbody tr:hover { background: #eef4fc; }

    td {
      padding: 0.35rem 0.65rem;
      border-bottom: 1px solid #eee;
      vertical-align: middle;
    }

    .tag-name    { font-weight: 600; color: #1a73e8; }
    .tag-kind    { color: #8e44ad; }
    .tag-scope   { color: #2e7d32; font-style: italic; }
    .tag-line    { color: #999; }
    .tag-pattern {
      color: #666;
      max-width: 340px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .empty-msg {
      color: #999;
      font-size: 0.9rem;
      text-align: center;
      padding: 1.5rem;
    }

    /* Raw output (dark code block) */
    .raw-output {
      background: #1e1e1e;
      color: #d4d4d4;
      border-radius: 5px;
      padding: 0.75rem 1rem;
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 0.8rem;
      line-height: 1.6;
      white-space: pre;
      overflow-x: auto;
      margin-top: 1rem;
      max-height: 340px;
      overflow-y: auto;
    }

    /* JSON syntax highlighting */
    .j-key    { color: #9cdcfe; }
    .j-str    { color: #ce9178; }
    .j-num    { color: #b5cea8; }
    .j-bool   { color: #569cd6; }

    details summary {
      cursor: pointer;
      font-size: 0.82rem;
      color: #666;
      margin-top: 0.75rem;
      user-select: none;
    }

    details summary:hover { color: #333; }

    /* Preset buttons */
    .presets {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-bottom: 0.6rem;
    }

    .presets span {
      font-size: 0.78rem;
      color: #888;
      align-self: center;
    }

    button.preset {
      padding: 0.2rem 0.65rem;
      font-size: 0.78rem;
      background: #f0f4f8;
      border: 1px solid #ccc;
      border-radius: 4px;
      cursor: pointer;
      color: #555;
    }

    button.preset:hover { background: #dce4ec; }

    /* Format badge in table header area */
    .format-badge {
      display: inline-block;
      font-size: 0.72rem;
      padding: 0.1rem 0.5rem;
      border-radius: 10px;
      background: #e3f0fd;
      color: #1a73e8;
      font-family: monospace;
      margin-left: 0.5rem;
      vertical-align: middle;
    }
  </style>
</head>
<body>

<h1>ctags WASM Demo</h1>
<p class="subtitle">
  Runs <code>ctags --oneshot=&lt;file&gt; --sort -o - --output-format json</code>
  entirely in the browser via WebAssembly.
</p>

<div class="card">
  <div class="controls">
    <div class="filename-group">
      <label for="filename">Filename <span style="font-weight:400;color:#aaa">(used for language detection)</span></label>
      <input type="text" id="filename" value="test.c" placeholder="test.c / script.py / app.js ...">
    </div>
    <div class="format-group">
      <label for="format">Output format</label>
      <select id="format">
        <option value="json"   selected>json</option>
        <option value="ctags">u-ctags</option>
        <option value="xref">xref</option>
        <option value="etags">etags</option>
      </select>
    </div>
    <button id="submit" disabled>Run</button>
  </div>

  <div class="presets">
    <span>Samples:</span>
    <button class="preset" data-lang="c">C</button>
    <button class="preset" data-lang="python">Python</button>
    <button class="preset" data-lang="javascript">JavaScript</button>
    <button class="preset" data-lang="go">Go</button>
    <button class="preset" data-lang="rust">Rust</button>
  </div>

  <label for="code">Code snippet <span style="font-weight:400;color:#aaa">(Ctrl+Enter to run)</span></label>
  <textarea id="code" spellcheck="false">int add(int a, int b) { return a + b; }
static void helper(void) {}
typedef struct { int x; int y; } Point;
#define MAX 100
</textarea>

  <div id="status" class="status loading">Loading ctags WASM...</div>
</div>

<div class="card" id="output-section">
  <div class="output-header">
    <h2>
      Tags
      <span class="format-badge" id="format-badge">json</span>
    </h2>
    <span class="tag-count" id="tag-count"></span>
  </div>
  <div id="table-container"></div>

  <details id="raw-details">
    <summary>Show raw output</summary>
    <div class="raw-output" id="raw-output"></div>
  </details>
</div>

<script src="./ctags-wasm.js"></script>
<script>
(async () => {

/* ------------------------------------------------------------------ */
/* Sample snippets                                                       */
/* ------------------------------------------------------------------ */
const SAMPLES = {
  c: {
    filename: 'test.c',
    code: `#include <stdio.h>

typedef struct {
    int x;
    int y;
} Point;

int add(int a, int b) { return a + b; }

static void print_point(const Point *p) {
    printf("(%d, %d)\\n", p->x, p->y);
}

int main(void) {
    Point pt = {1, 2};
    print_point(&pt);
    return 0;
}
`
  },
  python: {
    filename: 'script.py',
    code: `class Animal:
    def __init__(self, name):
        self.name = name

    def speak(self):
        raise NotImplementedError

class Dog(Animal):
    def speak(self):
        return f"{self.name} says woof!"

def greet(name: str) -> str:
    return f"Hello, {name}"

MAX_ANIMALS = 100
`
  },
  javascript: {
    filename: 'app.js',
    code: `const PI = 3.14159;

class Shape {
  constructor(color) {
    this.color = color;
  }
  area() { return 0; }
}

class Circle extends Shape {
  constructor(color, radius) {
    super(color);
    this.radius = radius;
  }
  area() { return PI * this.radius ** 2; }
}

function createShape(type, ...args) {
  if (type === 'circle') return new Circle(...args);
  throw new Error('unknown shape');
}
`
  },
  go: {
    filename: 'main.go',
    code: `package main

import "fmt"

type Animal interface {
    Speak() string
}

type Dog struct {
    Name string
}

func (d Dog) Speak() string {
    return d.Name + " says woof!"
}

func greet(name string) string {
    return fmt.Sprintf("Hello, %s", name)
}

func main() {
    d := Dog{Name: "Rex"}
    fmt.Println(d.Speak())
}
`
  },
  rust: {
    filename: 'main.rs',
    code: `struct Point {
    x: f64,
    y: f64,
}

impl Point {
    fn new(x: f64, y: f64) -> Self {
        Point { x, y }
    }

    fn distance(&self, other: &Point) -> f64 {
        ((self.x - other.x).powi(2) + (self.y - other.y).powi(2)).sqrt()
    }
}

trait Greet {
    fn greet(&self) -> String;
}

enum Color {
    Red,
    Green,
    Blue,
}

fn main() {
    let p = Point::new(0.0, 0.0);
    println!("{}", p.distance(&Point::new(3.0, 4.0)));
}
`
  }
};

/* ------------------------------------------------------------------ */
/* Initialize ctags WASM module                                         */
/* ------------------------------------------------------------------ */
let capturedOutput = '';
let Module;

try {
  Module = await CTagsModule({
    print:    (line) => { capturedOutput += line + '\n'; },
    printErr: () => {},
  });
  Module._ctags_init();

  document.getElementById('status').textContent = 'Ready';
  document.getElementById('status').className = 'status ready';
  document.getElementById('submit').disabled = false;
} catch (err) {
  document.getElementById('status').textContent = 'Failed to load WASM: ' + err.message;
  document.getElementById('status').className = 'status error';
}

/* ------------------------------------------------------------------ */
/* JSON output renderer                                                  */
/* ------------------------------------------------------------------ */
const KIND_LABELS = {
  f: 'function', c: 'class', m: 'method', v: 'variable',
  t: 'typedef',  s: 'struct', e: 'enumerator', d: 'macro',
  p: 'prototype', n: 'namespace', i: 'interface', g: 'enum',
  F: 'field', l: 'local', r: 'role', C: 'constant', M: 'module',
};

function kindLabel(k) {
  if (!k) return '';
  const label = KIND_LABELS[k];
  return label ? `${k} · ${label}` : k;
}

function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function renderJsonOutput(rawText) {
  const lines = rawText.trim().split('\n').filter(Boolean);

  // Parse valid JSON lines; separate ptags from real tags
  const tags   = [];
  let parseErr = 0;
  for (const line of lines) {
    try {
      const obj = JSON.parse(line);
      if (obj._type === 'tag') tags.push(obj);
      // ptags are intentionally omitted from the table
    } catch (_) {
      parseErr++;
    }
  }

  document.getElementById('tag-count').textContent =
    tags.length === 0 ? '' : `${tags.length} tag${tags.length === 1 ? '' : 's'}`;

  const container = document.getElementById('table-container');

  if (tags.length === 0) {
    container.innerHTML = '<div class="empty-msg">No tags found</div>';
    return;
  }

  // Determine which optional columns are present
  const hasLine     = tags.some(t => t.line    != null);
  const hasScope    = tags.some(t => t.scope   != null || t.class != null);
  const hasTyperef  = tags.some(t => t.typeref != null);
  const hasLanguage = tags.some(t => t.language != null);

  let html = '<table><thead><tr>'
    + '<th>Name</th>'
    + '<th>Kind</th>'
    + (hasLine     ? '<th>Line</th>'     : '')
    + (hasScope    ? '<th>Scope</th>'    : '')
    + (hasTyperef  ? '<th>Type</th>'     : '')
    + (hasLanguage ? '<th>Language</th>' : '')
    + '<th>Pattern</th>'
    + '</tr></thead><tbody>';

  for (const t of tags) {
    const scope   = t.scope   ?? t.class ?? '';
    const pattern = (t.pattern ?? '').replace(/^\/\^?/, '').replace(/\$?\/$/, '').trim();

    html += '<tr>'
      + `<td class="tag-name">${esc(t.name)}</td>`
      + `<td class="tag-kind">${esc(kindLabel(t.kind))}</td>`
      + (hasLine     ? `<td class="tag-line">${esc(t.line)}</td>`      : '')
      + (hasScope    ? `<td class="tag-scope">${esc(scope)}</td>`      : '')
      + (hasTyperef  ? `<td>${esc(t.typeref)}</td>`                    : '')
      + (hasLanguage ? `<td>${esc(t.language)}</td>`                   : '')
      + `<td class="tag-pattern" title="${esc(pattern)}">${esc(pattern)}</td>`
      + '</tr>';
  }

  html += '</tbody></table>';
  container.innerHTML = html;
}

/* ------------------------------------------------------------------ */
/* Plain-text output renderer (ctags / xref / etags)                   */
/* ------------------------------------------------------------------ */
function renderPlainOutput(rawText, format) {
  const lines = rawText.trim().split('\n').filter(Boolean);
  const realTags = format === 'ctags'
    ? lines.filter(l => !l.startsWith('!_TAG_'))
    : lines;

  document.getElementById('tag-count').textContent =
    realTags.length === 0 ? '' : `${realTags.length} line${realTags.length === 1 ? '' : 's'}`;

  document.getElementById('table-container').innerHTML =
    '<div class="empty-msg" style="text-align:left;padding:0">See raw output below.</div>';

  // Auto-expand raw block for non-JSON formats
  document.getElementById('raw-details').open = true;
}

/* ------------------------------------------------------------------ */
/* Syntax-highlighted JSON for the raw output panel                     */
/* ------------------------------------------------------------------ */
function highlightJson(text) {
  return text
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"([^"]+)":/g, '<span class="j-key">"$1"</span>:')
    .replace(/:\s*"([^"]*)"/g, ': <span class="j-str">"$1"</span>')
    .replace(/:\s*(-?\d+(?:\.\d+)?)/g, ': <span class="j-num">$1</span>')
    .replace(/:\s*(true|false|null)/g, ': <span class="j-bool">$1</span>');
}

/* ------------------------------------------------------------------ */
/* Main run handler                                                      */
/* ------------------------------------------------------------------ */
function runCtags() {
  const filename = document.getElementById('filename').value.trim() || 'input.c';
  const code     = document.getElementById('code').value;
  const format   = document.getElementById('format').value;

  // Switch output format
  Module.ccall('ctags_set_output_format', null, ['string'], [format]);

  capturedOutput = '';

  const encoded = new TextEncoder().encode(code);
  Module.ccall('ctags_parse_buffer', null,
    ['string', 'array', 'number'],
    [filename, encoded, encoded.length]
  );

  // Update format badge
  document.getElementById('format-badge').textContent = format;

  // Render output
  const rawText = capturedOutput;
  if (format === 'json') {
    renderJsonOutput(rawText);
    const rawEl = document.getElementById('raw-output');
    rawEl.innerHTML = rawText.trim().split('\n')
      .map(l => highlightJson(l)).join('\n');
    document.getElementById('raw-details').open = false;
  } else {
    renderPlainOutput(rawText, format);
    document.getElementById('raw-output').textContent = rawText || '(no output)';
  }

  document.getElementById('output-section').style.display = 'block';
  document.getElementById('output-section').scrollIntoView({ behavior: 'smooth' });
}

/* ------------------------------------------------------------------ */
/* Event bindings                                                        */
/* ------------------------------------------------------------------ */
document.getElementById('submit').addEventListener('click', runCtags);

document.getElementById('code').addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') runCtags();
});

// Auto-update filename extension when a preset is selected
document.getElementById('format').addEventListener('change', () => {
  // Do nothing automatically; user controls filename
});

document.querySelectorAll('button.preset').forEach(btn => {
  btn.addEventListener('click', () => {
    const s = SAMPLES[btn.dataset.lang];
    if (!s) return;
    document.getElementById('filename').value = s.filename;
    document.getElementById('code').value     = s.code;
  });
});

})();
</script>
</body>
</html>
